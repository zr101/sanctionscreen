[project]
name = "sanctionscreen"
version = "0.1.0"
description = "KYC name-screening microservice: screens customer names against the DFAT, UN and OFAC sanctions lists with layered, explainable matching."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "rapidfuzz>=3.9",
    "metaphone>=0.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
ui = [
    "streamlit>=1.36",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanctionscreen"]

# CPU-only torch wheels on Linux (Docker/CI) to avoid multi-GB CUDA downloads.
# macOS resolves torch from PyPI as normal.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval", "ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "embeddings: tests that require the sentence-transformers model (deselect with '-m \"not embeddings\"')",
]
